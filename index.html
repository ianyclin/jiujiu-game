<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="九九流星隊">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
<meta name="description" content="九九乘法練習遊戲：流星防衛戰、幽靈競速、雙人拔河、哪個大哪個小、炸彈拆除。錯題會更常出現，星圖看熟練度，每日任務、養寵物。">
<title>九九流星隊</title>
<!-- 字型自行託管（assets/fonts，OFL 授權，tools/make-fonts.py 只切出遊戲用到的字），不連 Google，離線也能用；swap：先用系統字型畫 -->
<style>
@font-face{font-family:'Chiron GoRound TC';font-weight:400;font-display:swap;src:url(assets/fonts/chiron-400.woff2) format('woff2')}
@font-face{font-family:'Chiron GoRound TC';font-weight:700;font-display:swap;src:url(assets/fonts/chiron-700.woff2) format('woff2')}
@font-face{font-family:'Chiron GoRound TC';font-weight:900;font-display:swap;src:url(assets/fonts/chiron-900.woff2) format('woff2')}
@font-face{font-family:'Lilita One';font-weight:400;font-display:swap;src:url(assets/fonts/lilita.woff2) format('woff2')}
/* 日文介面用 Zen Maru Gothic（日本字形）；只有 :lang(ja) 的元素用到，中文、英文不會下載 */
@font-face{font-family:'Zen Maru Gothic';font-weight:400;font-display:swap;src:url(assets/fonts/zenmaru-400.woff2) format('woff2')}
@font-face{font-family:'Zen Maru Gothic';font-weight:700;font-display:swap;src:url(assets/fonts/zenmaru-700.woff2) format('woff2')}
@font-face{font-family:'Zen Maru Gothic';font-weight:900;font-display:swap;src:url(assets/fonts/zenmaru-900.woff2) format('woff2')}
[hidden]{display:none!important}
:root{--sat:env(safe-area-inset-top,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
:root{
  /* 世界觀：黃昏轉入夜的天空、遠山與一座小鎮；刻意只做夜空一種主題
     版面：全螢幕遊戲舞台，操作鍵盤固定在下方，拇指好按 */
  --ink:#08111f; --night:#11223a; --deep:#0c1a2c;
  --ember:#ffae57; --sun:#ffd23f; --mint:#5ff2d0; --coral:#ff6161; --ice:#9fdcff;
  --paper:#f2f6fb; --muted:#93a9c0; --line:rgba(147,169,192,.24);
  --panel:rgba(12,24,41,.86); --key:#264766; --key2:#1a3350; --keyEdge:#091525;
  --f-num:'Lilita One','Chiron GoRound TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-zh:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:dark;
}
:lang(ja){--f-num:'Lilita One','Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;--f-zh:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Chiron GoRound TC',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-zh);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-inline:16px}

/* ---------- 主選單 ---------- */
#s-menu,#s-map,#s-pet{overflow-y:auto}
#s-menu{position:absolute;overflow-x:hidden}   /* 桌機傳統捲軸時寵物走到最右不撐出水平捲軸 */
.menu-in{position:relative;z-index:1;pointer-events:none} .menu-in>*{pointer-events:auto}   /* 空白處讓點擊穿到後面走來走去的寵物 */
.menu-pet{position:absolute;top:4px;left:0;width:64px;height:64px;padding:0;border:0;background:none;cursor:pointer;z-index:0;animation:petWalk 16s ease-in-out infinite alternate}
.menu-pet span{display:block;width:100%;height:100%;animation:petFace 32s steps(1) infinite}   /* 翻面與上下晃分兩層，同一個 transform 疊兩個動畫會被矩陣內插壓扁 */
.menu-pet svg{width:100%;height:100%;overflow:visible;animation:petBob .8s ease-in-out infinite alternate}
@keyframes petWalk{to{transform:translateX(var(--walk,calc(100vw - 64px)))}}
@keyframes petFace{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes petBob{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.menu-pet,.menu-pet span,.menu-pet svg{animation:none}}
.menu-in{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3.2vh,30px);padding-block:24px;width:100%}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{font-weight:900;font-size:clamp(68px,19vw,116px);line-height:.9;color:var(--sun);letter-spacing:-.05em;text-shadow:0 5px 0 #a87a00,0 14px 40px rgba(255,210,63,.35);transform:rotate(-5deg)}
.brand-sub span{display:block;font-weight:900;font-size:clamp(32px,8.6vw,50px);line-height:1;letter-spacing:.04em;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(8,17,31,.9)}
.brand-sub small{display:block;color:var(--muted);font-size:14px;letter-spacing:.24em;margin-top:10px}
.brand-sub small.on{color:var(--ice);letter-spacing:.06em;text-wrap:balance}
:root:not(:lang(zh)) .brand-sub small{letter-spacing:.06em}   /* 英文、日文的副標題比較長，中文的寬字距會折行 */
.modes{display:grid;gap:12px;width:100%;max-width:470px}
.mode{display:grid;grid-template-columns:62px 1fr;column-gap:14px;row-gap:3px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 6px 0 var(--keyEdge);cursor:pointer;transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--keyEdge)}
.mode{position:relative}
/* App 版：還沒解鎖的遊戲右上角的小牌子（試玩／鎖）；網頁版不會出現 */
.m-lock{position:absolute;top:-9px;right:14px;display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:900;line-height:20px;background:var(--mint);color:#08111f;box-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.m-lock.locked{background:#33475f;color:var(--ice);padding:2px 8px}
.mode .m-lock svg{width:14px;height:14px;grid-row:auto}
html:not(.app) .app-only{display:none!important}
.buy-msg{min-height:1.4em;color:var(--ice);font-size:14px;text-align:center}
.pick{display:grid;gap:10px}
.pick button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;box-shadow:0 5px 0 var(--keyEdge);transition:transform .06s,box-shadow .06s}
.pick button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--keyEdge)}
.pick b{display:block;font-size:20px;font-weight:900}
.pick small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pick em{font-style:normal;font-family:var(--f-num);color:var(--sun);font-size:15px;white-space:nowrap}
.pick .sd b{color:var(--coral)}
.mode svg{grid-row:span 2;width:62px;height:62px}
.m-t{font-weight:900;font-size:20px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m-t em{font-style:normal;font-family:var(--f-num);font-size:14px;color:var(--sun);font-weight:400;text-align:right;max-width:50%;line-height:1.2}
.m-t>span:first-child,.m-t{white-space:nowrap} .m-t em{white-space:normal} .m-t em .nw{white-space:nowrap}
.m-d{color:var(--muted);font-size:14px;line-height:1.45}
.menu-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:470px;width:100%}
#s-menu .menu-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}   /* 三欄等寬，每種語言位置都一樣 */
#go-who{align-self:flex-start}   /* 靠左，右邊那一段留給走來走去的寵物（placeMenuPet 算走道） */
/* 加入主畫面後沒有網址列，但狀態列與 Home 橫條會吃掉約 80px：矮螢幕把主選單壓緊，六顆按鈕要一眼看到 */
.menu-in{padding-block:12px 14px}   /* 安全區由 :root 的 padding 處理，這裡不再加 */
@media (max-height:960px){.menu-in{gap:clamp(8px,1.5vh,16px)}.mode{padding:10px 14px;row-gap:1px}.m-d{font-size:13px;line-height:1.35}.brand-mark{font-size:clamp(58px,15vw,96px)}.brand-sub small{margin-top:6px}}
@media (max-height:740px){.m-d{display:none}.mode{padding:9px 14px;border-radius:18px}.mode svg{width:44px;height:44px;grid-row:auto}.brand-mark{font-size:clamp(52px,13vw,80px)}}
@media (max-height:600px){.menu-in{gap:6px;padding-block:8px 10px}.mode{padding:7px 12px}.modes{gap:8px}.brand-mark{font-size:46px}.brand-sub span{font-size:26px}}
#s-menu .menu-foot .chip{justify-content:center;padding-inline:6px;font-size:14px;white-space:nowrap;min-height:44px}
#s-menu .menu-foot .chip b{font-size:14px}
#s-menu .menu-foot .chip{gap:4px;padding-inline:4px;font-size:13.5px}
.chip{border:1px solid var(--line);background:rgba(12,24,41,.72);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip b{font-family:var(--f-num);font-weight:400;color:var(--sun);font-size:17px}
.chip.tog::before{content:'';width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.chip.tog[aria-pressed="true"]{border-color:var(--mint);color:var(--mint)}
.chip.tog[aria-pressed="true"]::before{background:var(--mint);border-color:var(--mint)}

/* ---------- 每日任務 ---------- */
.quests{width:100%;max-width:470px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:grid;gap:8px}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.q-head b{font-size:17px;font-weight:900}
.q-head span{font-size:13px;color:var(--muted);font-weight:700}
.q-head span em{font-style:normal;font-family:var(--f-num);color:var(--sun);font-size:16px;margin-inline:2px}
.q-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:15px;font-weight:700;line-height:1.3}
.q-row i{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:15px;color:transparent}
.q-row.done i{background:var(--mint);border-color:var(--mint);color:#063d30}
.q-row.done span{color:var(--muted);text-decoration:line-through}
.q-row em{font-style:normal;font-family:var(--f-num);color:var(--sun);font-size:15px;white-space:nowrap}
.q-row.done em{color:var(--mint)}
.q-all{text-align:center;color:var(--mint);font-weight:900;font-size:14px}
.q-list{display:grid;gap:8px;text-align:left}
.q-head{justify-content:center}
.chip.todo{position:relative}
.chip.todo::after{content:'';position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--ink),0 0 10px var(--coral)}
.chip.ok b{color:var(--mint)}
.name-egg svg{width:110px;height:110px}
.name-in{width:100%;font:inherit;font-size:24px;font-weight:900;text-align:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--paper)}
.name-in:focus{outline:2px solid var(--mint);border-color:var(--mint)}
.name-sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.name-sug button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:11px 14px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;color:var(--paper)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 68px);transform:translate(-50%,-30px);z-index:9;background:linear-gradient(180deg,#152a45,#0e1d31);border:1px solid var(--mint);border-radius:999px;padding:10px 18px;font-weight:900;font-size:15px;color:var(--mint);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;white-space:normal;text-align:center;max-width:92vw;border-radius:18px;line-height:1.3}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast.mid{top:calc(50% - 60px);transform:translate(-50%,-50%)}   /* 拔河：上半是對手的臉，toast 放中線才不會蓋住表情 */

/* ---------- 共用：鍵盤、題目 ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:420px;margin-inline:auto}
.key{font-family:var(--f-num);font-size:clamp(24px,4.2vh,34px);height:clamp(46px,7.2vh,66px);border:0;border-radius:16px;background:linear-gradient(var(--key),var(--key2));color:var(--paper);box-shadow:0 5px 0 var(--keyEdge),inset 0 1px 0 rgba(255,255,255,.14);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.key.wide{grid-column:span 2}
.key.back{color:var(--muted);font-size:clamp(20px,3.4vh,28px)}
.key.hit{transform:translateY(4px);box-shadow:0 1px 0 var(--keyEdge);background:linear-gradient(#30587d,#22405f)}
.aq{font-family:var(--f-num);font-size:clamp(32px,8.4vw,44px);display:flex;align-items:center;justify-content:center;gap:.22em;white-space:nowrap;line-height:1.1}
.aq.dim{font-family:var(--f-zh);font-size:18px;color:var(--muted);font-weight:700}
.aq.seq,.half .aq.seq{font-size:clamp(24px,6.4vw,38px);gap:.1em;flex-wrap:wrap;row-gap:.15em}
.qcard .aq.seq{font-size:clamp(30px,8.6vw,54px)}
.qlab{flex-basis:100%;text-align:center;font-family:var(--f-zh);font-size:.48em;font-weight:700;color:var(--ice);line-height:1;letter-spacing:.06em}
.slot{display:inline-grid;place-items:center;width:.82em;height:1.08em;border-radius:.16em;background:rgba(255,255,255,.07);border-bottom:4px solid var(--muted);font-style:normal;color:var(--sun)}
.slot.on{border-color:var(--sun);background:rgba(255,210,63,.1)}
.hint{font-size:14px;color:#ff9a9a;font-weight:700;min-height:1.3em;text-align:center}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.icon-btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(12,24,41,.66);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.link-btn{border:1px solid var(--line);background:rgba(12,24,41,.66);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer;font-size:15px}

/* ---------- 流星防衛戰 ---------- */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding-block:10px 0}
.hud-l{display:flex;align-items:center;gap:6px;min-width:0}
.hearts{display:flex;gap:2px;flex-wrap:nowrap;flex:none}
.hearts.inv svg{filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}
.hshield{width:26px;height:26px;flex:none;animation:hsh .8s ease-in-out infinite}
@keyframes hsh{50%{transform:scale(1.18);filter:drop-shadow(0 0 8px rgba(255,210,63,.9))}}
.fire{display:flex;gap:1px;align-items:center;min-height:44px;border:2px solid transparent;background:transparent;border-radius:12px;padding:4px 7px;cursor:pointer;touch-action:manipulation}
.fire svg{width:24px;height:24px}
@media (max-width:400px){.score small{letter-spacing:.06em}.fire{padding:2px 3px;gap:0}.fire svg{width:17px;height:17px}.hearts svg{width:19px;height:19px}.hud{gap:4px}}
.score{min-width:0} .score small{white-space:nowrap}
.fire.ready{border-color:var(--ember);background:rgba(255,174,87,.18)}
.hearts svg{width:22px;height:22px}
.score{text-align:center;font-family:var(--f-num);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--f-zh);font-size:12px;color:var(--muted);letter-spacing:.16em;margin-top:3px;font-weight:700}
.hud-r{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.combo{text-align:right;line-height:1;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.combo b{display:block;font-family:var(--f-num);font-size:26px;color:var(--ember);font-weight:400;letter-spacing:0}
.combo em{font-style:normal;font-family:var(--f-num);color:var(--sun);font-size:15px;letter-spacing:0}
.combo.hot b{color:var(--sun);text-shadow:0 0 14px rgba(255,174,87,.8)}
.combo{position:relative;padding:4px 10px;border-radius:999px}
.combo.shield{background:rgba(159,220,255,.14);box-shadow:inset 0 0 0 1.5px rgba(159,220,255,.55),0 0 14px rgba(159,220,255,.4);animation:bubble 1.6s ease-in-out infinite;overflow:hidden}
.combo.shield::after{content:'';position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:shimmer 1.6s linear infinite;pointer-events:none}
@keyframes bubble{50%{box-shadow:inset 0 0 0 1.5px rgba(159,220,255,.95),0 0 24px rgba(159,220,255,.85)}}
@keyframes shimmer{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.freeze{height:5px;border-radius:3px;background:rgba(159,220,255,.18);margin-top:8px;overflow:hidden}
.freeze i{display:block;height:100%;width:0;background:var(--ice);border-radius:3px}
.freeze.gold{background:rgba(255,210,63,.18)} .freeze.gold i{background:var(--sun)}
.freeze.inv{background:rgba(255,97,97,.18)} .freeze.inv i{background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--ice))}
.card.help{gap:8px;text-align:left}
.xbtn{align-self:flex-end;margin:-6px -6px -44px 0;z-index:2;font-size:18px;font-weight:900;color:var(--muted)}
.help h3{text-align:center;margin-bottom:4px}
.card .hhead{position:sticky;top:-22px;z-index:2;margin:-22px -20px 0;padding:16px 20px 8px;background:#152a45;border-bottom:1px solid var(--line)}
.card .hhead h3{margin:0;padding:0 40px;text-wrap:balance}
.set-h{margin:4px 0 -6px;font-size:16px;color:var(--sun);text-align:left}
.card .hhead .xbtn{position:absolute;top:10px;right:12px;margin:0}
.brand-t{color:var(--sun);text-shadow:0 2px 0 #a87a00}
.help h4{margin:8px 0 0;font-size:15px;color:var(--sun);letter-spacing:.08em}
.rotate{display:none;position:fixed;inset:0;z-index:30;background:var(--ink);place-items:center;text-align:center;font-weight:900;font-size:22px;color:var(--paper)}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.rotate{display:grid}}
img,svg,canvas{-webkit-touch-callout:none}
html,body{overscroll-behavior:none}
.help .hgrp{margin:14px 0 -2px;font-size:12px;letter-spacing:.3em;color:var(--muted);text-align:center}
.stage{flex:1;position:relative;pointer-events:none;min-height:0}
.banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-weight:900;font-size:clamp(34px,9vw,60px);opacity:0;color:var(--paper);text-shadow:0 5px 0 rgba(0,0,0,.4)}
.banner.on{animation:ban 1.9s ease forwards}
.banner.boss{color:var(--coral)}
.banner.good{color:var(--mint)}
@keyframes ban{0%{opacity:0;transform:scale(.5)}14%{opacity:1;transform:scale(1.1)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.05)}}
.dock{padding-block:2px 12px}
.answer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:82px;padding-block:8px 6px}
.answer.pop{animation:pop .32s ease}
/* 發射鈕浮在舞台右下角（鍵盤正上方），不佔版面，題目不會被擠偏 */
.fire-big{position:absolute;right:0;bottom:10px;pointer-events:auto;height:clamp(46px,7.2vh,66px);padding:0 14px;border-radius:16px;border:0;background:linear-gradient(#ff9a4a,#d85a1a);color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #7a2e08;display:flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;white-space:nowrap;animation:firepulse .6s ease-in-out infinite}
.fire-big svg{width:26px;height:26px}
.fire-big:active{transform:translateY(4px);box-shadow:0 1px 0 #7a2e08;animation:none}
@keyframes firepulse{50%{transform:scale(1.07);box-shadow:0 5px 0 #7a2e08,0 0 20px rgba(255,154,74,.9)}}

/* ---------- 幽靈競速 ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px 4px}
.topbar .link-btn,.topbar .timer{flex:none;white-space:nowrap} .topbar .prog{min-width:0;text-align:center;letter-spacing:.04em}   /* 窄螢幕：返回鈕和計時不折行，中間的進度讓它縮 */
.timer{font-family:var(--f-num);font-size:30px;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:999px;background:rgba(8,17,31,.62);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.timer small{font-family:var(--f-zh);font-size:13px;color:var(--muted);margin-left:6px;font-weight:700}
.track{position:relative;padding:12px 14px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px;width:100%;max-width:560px;margin-inline:auto}
.lane-row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:14px}
.lane-label{font-size:12px;color:var(--muted);font-weight:700}
.lane{position:relative;height:34px;margin-right:22px}
.lane::before{content:'';position:absolute;left:0;right:-22px;top:50%;border-top:2px dashed var(--line)}
.lane::after{content:'';position:absolute;right:-22px;top:4px;bottom:4px;width:8px;background:repeating-linear-gradient(var(--paper) 0 5px,#20344c 5px 10px);border-radius:2px}
.racer{position:absolute;top:50%;left:0;transform:translate(-30%,-50%);transition:left .4s cubic-bezier(.3,1.5,.5,1)}
.racer svg{width:42px;height:28px;display:block}
.racer.g{opacity:.6}
.ghost-note{font-size:12px;color:var(--mint);font-weight:700;text-align:right;min-height:1.2em}
.qwrap{flex:1;display:grid;place-items:center;min-height:0}
.qcard{display:flex;flex-direction:column;align-items:center;gap:10px}
.qcard .aq{font-size:clamp(48px,14vw,96px)}
.qcard.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12);filter:drop-shadow(0 0 18px rgba(95,242,208,.7))}100%{transform:scale(1)}}
.prog{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.12em}

/* ---------- 雙人拔河 ---------- */
#s-versus{padding-inline:0;touch-action:none}   /* 兩個人同時按會被 iOS 當成雙指縮放而吃掉一邊的觸控：這個畫面不給任何手勢 */
.half{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:8px 16px 12px;min-height:0;position:relative}
.half.top{transform:rotate(180deg);background:radial-gradient(120% 90% at 50% 100%,rgba(255,174,87,.14),transparent 70%)}
.half.bot{background:radial-gradient(120% 90% at 50% 100%,rgba(95,242,208,.12),transparent 70%)}
.who{font-size:13px;letter-spacing:.2em;font-weight:900;text-align:center}
.top .who{color:var(--ember)} .bot .who{color:var(--mint)}
.half .aq{font-size:clamp(30px,8vw,46px)}
.half .pad{max-width:360px;gap:7px}
.half .key{height:clamp(44px,5.4vh,56px);font-size:clamp(20px,3.4vh,30px)}
.half.locked .pad{opacity:.3;pointer-events:none}
@media (min-height:760px){.half{padding-bottom:30px}}
@media (max-height:600px){.half{padding:4px 12px 6px;gap:2px}.half .aq{font-size:24px}.half .hint{min-height:0}.half .pad{gap:5px}.band{height:50px}}   /* 很矮的螢幕（iPhone SE 一代）：拔河兩半壓緊，內容才不會蓋到中間的繩子；鍵仍是 44px */   /* 鍵盤離螢幕邊緣遠一點：上方那位的鍵盤（轉 180°）原本只離上緣 12px，iOS 會把貼邊的觸控先扣住看是不是系統手勢 */
#s-versus.cpu .half.top{transform:none;justify-content:center}
#s-versus.cpu .half.top .pad{display:none}
#s-versus.cpu .half.top .aq{font-size:clamp(26px,7vw,40px)}
.cpubox{display:flex;flex-direction:column;align-items:center;gap:6px}
.cpu-face{width:clamp(64px,14vh,96px);height:auto}
.cpu-face.thinking{animation:cpuThink .5s ease-in-out infinite}
@keyframes cpuThink{50%{transform:translateY(-4px) rotate(3deg)}}
.cpu-face.oops{animation:shk .35s}
.cpu-face.happy{animation:cpuHappy .9s ease-in-out 2}
@keyframes cpuHappy{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}
.cpu-face.sad{animation:cpuSad 1.2s ease-in-out forwards}
@keyframes cpuSad{40%{transform:translateY(6px) rotate(-8deg)}100%{transform:translateY(8px) rotate(6deg)}}
.think{width:min(60%,220px);height:8px;border-radius:4px;background:rgba(255,174,87,.18);overflow:hidden}
.think i{display:block;height:100%;width:0;background:var(--ember);border-radius:4px}
.cpu-say{font-size:13px;color:var(--ember);font-weight:700;min-height:1.2em}
.vres{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(40px,11vw,70px);pointer-events:none;text-shadow:0 5px 0 rgba(0,0,0,.45),0 0 14px rgba(4,9,18,.95),0 0 28px rgba(4,9,18,.9)}
#s-versus.cpu #v-res-top{align-items:start;padding-top:10px}
.vres.win{color:var(--sun)} .vres.lose{color:var(--muted);font-size:clamp(28px,8vw,48px)}
.band{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding-inline:16px;background:rgba(6,12,24,.78);border-block:1px solid var(--line)}
.end{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-num);color:#08111f;font-size:15px}
.end.p1{background:var(--mint)} .end.p2{background:var(--ember)}
.rope{position:relative;flex:1;height:10px;border-radius:5px;background:repeating-linear-gradient(115deg,#d1a86e 0 6px,#9c7443 6px 12px)}
.rope .mid{position:absolute;left:50%;top:-8px;bottom:-8px;width:2px;background:rgba(255,255,255,.35)}
.rope.f2{background:repeating-linear-gradient(115deg,#ffd77a 0 6px,#c99a4a 6px 12px);box-shadow:0 0 14px rgba(255,210,63,.55)}   /* 拉很久分不出勝負：繩子變滑，一次拉兩格 */
.rope.f3{background:repeating-linear-gradient(115deg,#ffb08a 0 6px,#d9633f 6px 12px);box-shadow:0 0 18px rgba(255,120,80,.7)}
.knot{position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);transition:left .35s cubic-bezier(.3,1.6,.5,1)}
.band-btns{display:flex;gap:10px;justify-content:center;flex:1}
.band-btns .btn{padding:12px 16px;min-height:44px;font-size:16px}

/* ---------- 星圖 ---------- */
.map-in{margin-block:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px 26px;width:100%}
.map-head{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.map-head h2{margin:0;font-size:24px;font-weight:900}
.map-head h2 b{font-family:var(--f-num);font-weight:400;color:var(--sun);margin-left:8px}
.grid99{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%;max-width:520px}
/* 平板：手機版面放大一點，不然卡片與鍵盤只佔三分之一寬；12×12 星圖的格子也要 ≥ 44px */
@media (min-width:700px) and (min-height:700px){.modes,.menu-foot{max-width:560px}.pad{max-width:520px}.half .pad{max-width:440px}.cmp-opts,.tiles{max-width:520px}.card{max-width:480px}.grid99{max-width:660px}.grid99.wide .cell,.grid99.wide .h{font-size:17px}.cell,.grid99 .h{font-size:18px}}
.grid99.wide{gap:2px} .grid99.wide .cell{font-size:clamp(11px,3vw,15px);border-radius:6px} .grid99.wide .h{font-size:clamp(11px,3vw,15px)}
.grid99 .h{font-family:var(--f-num);color:var(--muted);display:grid;place-items:center;font-size:clamp(12px,3.4vw,18px)}
.cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-family:var(--f-num);font-size:clamp(11px,3.2vw,17px);border:1px solid var(--line);background:rgba(255,255,255,.03);color:#5d7590;cursor:pointer;padding:0;max-width:100%}
.cell.learn{background:rgba(255,174,87,.16);color:#ffd2a1;border-color:rgba(255,174,87,.45)}
.cell.weak{background:rgba(255,97,97,.2);color:#ffc4c4;border-color:rgba(255,97,97,.65);animation:pulse 1.8s ease-in-out infinite}
.cell.star{background:radial-gradient(circle at 45% 35%,#fff6c4,var(--sun) 58%,#d39f00);color:#3b2a00;border-color:transparent;box-shadow:0 0 12px rgba(255,210,63,.4)}
.cell.sel{outline:2px solid var(--paper);outline-offset:1px}
.cell.off{opacity:.28}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,97,97,.25)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.info{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;min-height:52px}
.info b{font-family:var(--f-num);font-weight:400;color:var(--sun);font-size:18px}
.danger{border:1px solid rgba(255,97,97,.4);background:transparent;color:#ff9a9a;border-radius:12px;padding:12px 16px;min-height:44px;font-weight:700;cursor:pointer;font-size:14px}

/* ---------- 哪個大／哪個小 ---------- */
.cmp-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,24px);min-height:0;padding-block:8px 16px;width:100%}
.cmp-ask{font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1;display:flex;align-items:center;gap:10px;min-height:1.2em}
.cmp-ask.big{color:var(--sun);text-shadow:0 4px 0 #a87a00}
.cmp-ask.small{color:var(--ice);text-shadow:0 4px 0 #2a5a7a}
.cmp-ask svg{width:.85em;height:.85em}
.cmp-opts{display:grid;gap:12px;width:100%;max-width:420px}
.cmp-opt{display:flex;align-items:center;justify-content:center;gap:.4em;padding:0 18px;height:clamp(62px,11vh,92px);border:2px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 6px 0 var(--keyEdge);cursor:pointer;font-family:var(--f-num);font-size:clamp(30px,8vw,44px);color:var(--paper);touch-action:manipulation;transition:transform .08s,box-shadow .08s,border-color .15s,background .15s}
.cmp-opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--keyEdge)}
.cmp-opt .eq{color:var(--muted);font-size:.72em;min-width:2.6em;text-align:left;opacity:0;transition:opacity .2s}
.cmp-opt.show .eq{opacity:1}
.cmp-opt.ok{border-color:var(--mint);background:rgba(95,242,208,.14);color:var(--mint)}
.cmp-opt.ok .eq{color:var(--mint)}
.cmp-opt.bad{border-color:var(--coral);background:rgba(255,97,97,.14);color:#ffbcbc}
.cmp-opt.want{border-color:var(--mint);animation:want .9s ease-in-out infinite}
@keyframes want{50%{box-shadow:0 6px 0 var(--keyEdge),0 0 0 6px rgba(95,242,208,.35)}}
.cmp-opt.pop{animation:pop .32s ease}
.cmp-streak{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.1em;min-height:1.2em}
#c-timer{font-size:24px;transition:opacity .3s}
#c-timer.off{opacity:.35}

/* ---------- 炸彈拆除 ---------- */
.bm-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,16px);min-height:0;padding-block:4px 14px;width:100%}
.bm-task{text-align:center;font-weight:900;font-size:clamp(22px,6vw,32px);line-height:1.25}
.bm-task b{font-family:var(--f-num);font-weight:400;color:var(--sun);font-size:1.5em;vertical-align:-.08em;margin-inline:.08em}
.bm-task small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.bm-head{--bombw:clamp(84px,22vw,108px);display:flex;align-items:flex-start;gap:10px;width:100%;max-width:420px}
.bm-rest{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bm-head .bm-task{text-align:left;padding-top:2px}
.bomb{width:var(--bombw);height:auto;flex:none;overflow:visible}
.bomb .body{transform-origin:60px 74px}
.fuseline{display:block;width:100%;height:28px;overflow:visible;margin-top:calc(var(--bombw) * .217 - 14px)}
.fuseline .ash{fill:none;stroke:rgba(147,169,192,.3);stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.fuseline .fuse{fill:none;stroke:#c9a46b;stroke-width:5;stroke-linecap:round}
.spark{transform-origin:center;transform-box:fill-box}
.bomb.low .body{animation:wobble .22s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bomb.boom .body{animation:bombgone .45s ease-out forwards}
@keyframes bombgone{0%{transform:scale(1);opacity:1}35%{transform:scale(1.4);opacity:1}100%{transform:scale(2);opacity:0}}
.bomb .burst{transform-origin:60px 74px;transform:scale(0);opacity:0}
.bomb.boom .burst{animation:burst .75s ease-out forwards}
@keyframes burst{0%{transform:scale(.15) rotate(0);opacity:1}55%{transform:scale(1.7) rotate(18deg);opacity:1}100%{transform:scale(2.4) rotate(30deg);opacity:0}}
.bm-head.boom .spark,.bm-head.ok .spark{opacity:0}
.fuseline{transition:opacity .5s} .bm-head.boom .fuseline{opacity:0}   /* 炸彈炸掉了，引線不要單獨浮著 */
.bm-head.ok .fuse{stroke:var(--mint)}
.bomb.ok .body{animation:pop .4s ease}
.bomb.ok .body circle{stroke:var(--mint)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:400px}
.tile{height:clamp(54px,8.4vh,74px);border-radius:16px;border:2px solid var(--line);background:var(--panel);box-shadow:0 5px 0 var(--keyEdge);font-family:var(--f-num);font-size:clamp(26px,7vw,36px);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation;transition:transform .06s,box-shadow .06s,border-color .15s,background .15s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--keyEdge)}
.tile.got{border-color:var(--mint);background:rgba(95,242,208,.16);color:var(--mint);animation:pop .32s ease}
.tile.miss{border-color:var(--sun);background:rgba(255,210,63,.16);color:var(--sun);animation:missblink .9s ease-in-out infinite}
@keyframes missblink{50%{box-shadow:0 5px 0 var(--keyEdge),0 0 0 5px rgba(255,210,63,.4)}}
.tile.boom{border-color:var(--coral);background:rgba(255,97,97,.22);color:#ffbcbc}
.tiles.off .tile{pointer-events:none}
.bm-found{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.1em;min-height:1.3em}
.bm-found b{font-family:var(--f-num);font-weight:400;color:var(--mint);font-size:18px}
.bm-msg{text-align:center;font-weight:900;font-size:clamp(20px,5.6vw,28px);min-height:1.3em}
.bm-msg.good{color:var(--mint)} .bm-msg.bad{color:var(--coral)}
.bm-why{font-size:14px;color:var(--muted);font-weight:700;text-align:center;min-height:1.3em;line-height:1.4}
#bm-timer{font-size:24px}

/* ---------- 寵物 ---------- */
.pet-intro{margin:0;color:var(--muted);font-size:15px;line-height:1.6;text-align:center;max-width:470px}
.pet-intro b{color:var(--sun)}
.pet-pick{width:100%;max-width:400px}
.pet-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px}
.pet-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 5px 0 var(--keyEdge);cursor:pointer;color:var(--paper)}
.pet-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--keyEdge)}
.pet-card svg{width:72px;height:72px}
.pet-card.locked{opacity:.75;cursor:default;box-shadow:none;border-style:dashed}
.pet-card.locked small{color:var(--ember)}
.pet-card b{font-size:16px;font-weight:900}
.pet-card small{font-size:12px;color:var(--muted)}
.pet-show{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:470px}
.pet-stage{width:min(70vw,260px);height:min(70vw,260px);display:grid;place-items:center}
.pet-stage svg{width:100%;height:100%;overflow:visible;animation:petIdle 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes petIdle{50%{transform:translateY(-6px) scale(1.02,.98)}}
.pet-stage.pop svg{animation:petPop .5s ease}
@keyframes petPop{30%{transform:scale(1.18,.86)}60%{transform:scale(.94,1.1) translateY(-10px)}}
.pet-stage.wobble svg{animation:petWobble .9s ease-in-out infinite}
@keyframes petWobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pet-name{font-size:22px;font-weight:900;text-align:center}
.pet-name small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.pet-bar{width:100%;max-width:320px;height:12px;border-radius:6px;background:rgba(255,210,63,.15);overflow:hidden}
.pet-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--sun));border-radius:6px;transition:width .4s}
.pet-next{font-size:14px;color:var(--muted);font-weight:700;min-height:1.3em}
.pet-tip{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
#pet-feed:disabled{opacity:.45;box-shadow:none;transform:none}
.gear{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:470px;margin-top:4px}
.gear button{display:flex;flex-direction:column;align-items:center;gap:3px;width:86px;text-align:center;line-height:1.25;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--paper);font-weight:700;font-size:13px;cursor:pointer}
.gear button img{height:32px;width:auto;max-width:52px}
.gear button small{font-size:11px;color:var(--muted);font-weight:700}
.gear button.mystery{border-style:dashed;border-color:rgba(159,220,255,.45);background:rgba(159,220,255,.05);color:var(--muted)}
.gear button.mystery .qmark{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px dashed rgba(159,220,255,.6);color:var(--ice);font-weight:900;font-size:18px}
.gear button[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,210,63,.14);color:var(--sun)}
.gear button:disabled{opacity:.45;cursor:default}
.gear-t{flex-basis:100%;text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.pet-stage.bye svg{animation:petBye 1.6s ease-in forwards}
@keyframes petBye{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-140px) scale(.5);opacity:0}}
.alumni{width:100%;max-width:470px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.alum-t{flex-basis:100%;text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.alum{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px;min-height:44px;padding:6px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--paper);font-weight:700;font-size:13px;cursor:pointer}
.alum svg{width:46px;height:46px;overflow:visible}
.alum small{font-size:11px;color:var(--muted);font-weight:700}
.name-egg.big svg{width:150px;height:150px;overflow:visible}

/* ---------- 覆蓋層 ---------- */
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(4,9,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#152a45,#0e1d31);border:1px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;text-align:center;max-height:100%;overflow-y:auto}
.card h3{margin:0;font-size:24px;font-weight:900}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:15px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:18px;cursor:pointer;background:var(--sun);color:#2a1d00;box-shadow:0 5px 0 #a87a00;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a87a00}
.btn.alt{background:transparent;color:var(--paper);box-shadow:none;border:1px solid var(--line)}
.btn-col{display:grid;gap:10px}
.res-stars{font-size:42px;letter-spacing:.12em;color:var(--sun);line-height:1}
.res-stars span{color:rgba(255,255,255,.15)}
.res-big{font-family:var(--f-num);font-size:64px;line-height:1}
.res-label{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.15em;margin-top:-6px}
.res-note{font-weight:900;color:var(--mint);min-height:1.2em}
.res-rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res-rows div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 4px}
.res-rows b{display:block;font-family:var(--f-num);font-size:22px;font-weight:400}
.res-rows span{font-size:12px;color:var(--muted)}
.wrongs-t{font-size:13px;color:var(--muted);font-weight:700}
.wrongs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wrongs i{font-style:normal;font-family:var(--f-num);background:rgba(255,97,97,.14);color:#ffbcbc;border-radius:10px;padding:4px 10px;font-size:17px}
.legal{margin:0;font-size:11px;line-height:1.5;color:rgba(147,169,192,.7);text-align:center}
.legal a,.about-fb,.about-priv{color:var(--ice);text-decoration:underline;text-underline-offset:2px;display:inline-block;padding:12px 6px;margin:-12px -6px}   /* 觸控範圍 ≥ 44px，版面不變 */
#gate-pad{margin-block:4px}
#gate-q{display:block;text-align:center;white-space:normal;font-size:clamp(24px,7vw,34px);line-height:1.5;text-wrap:balance}   /* 混合運算比較長，窄螢幕要能換行 */
.setlist{display:grid;gap:8px;text-align:left}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.setrow b{display:block;font-size:16px;font-weight:900}
.setrow small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.sw{width:64px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer;flex:none;padding:0;transition:background .15s,border-color .15s}
.sw i{position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.setrow.tables{grid-template-columns:minmax(0,1fr);row-gap:8px}
.bk-h{margin:6px 0 -6px;font-size:16px;color:var(--sun);text-align:left}
.bk-code{width:100%;min-height:72px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--paper);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 10px;resize:vertical;-webkit-user-select:text;user-select:text;word-break:break-all}
.bk-code:focus{outline:2px solid var(--mint);border-color:var(--mint)}
.bk-msg{min-height:1.3em;font-weight:700;color:var(--mint);font-size:14px;line-height:1.5}
.bk-msg.bad{color:#ff9a9a}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tgrid button{aspect-ratio:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-family:var(--f-num);font-size:22px;cursor:pointer;padding:0;touch-action:manipulation;transition:background .15s,border-color .15s,color .15s}
.tgrid button[aria-pressed="true"]{background:rgba(255,210,63,.16);border-color:var(--sun);color:var(--sun)}
.tgrid button.ext[aria-pressed="true"]{background:rgba(95,242,208,.14);border-color:var(--mint);color:var(--mint)}
.tgrid button:active{transform:scale(.94)}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.langs button{font-family:var(--f-zh);min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-weight:900;font-size:15px;cursor:pointer;padding:0 4px}
.langs button[aria-pressed="true"]{background:rgba(95,242,208,.14);border-color:var(--mint);color:var(--mint)}
.who{align-self:center;border:1px solid var(--line);background:rgba(12,24,41,.72);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700;font-size:14px;color:var(--ice);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.who-list{display:grid;gap:8px}
.who-list button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--paper);font-weight:900;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.who-list button[aria-pressed="true"]{border-color:var(--sun);background:rgba(255,210,63,.14);color:var(--sun)}
.who-list button small{font-weight:400;color:var(--muted);font-size:13px}
.who-hint{display:block;color:var(--ice);font-size:13px;margin-top:-4px}
.sw[aria-pressed="true"]{background:rgba(95,242,208,.22);border-color:var(--mint)}
.sw[aria-pressed="true"] i{left:26px;background:var(--mint)}
.opt{display:grid;gap:8px}
.opt button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:12px;font-weight:700;cursor:pointer;text-align:left;font-size:15px}
.opt button[aria-pressed="true"]{border-color:var(--ember);background:rgba(255,174,87,.12);color:#ffd2a1}
.wlist{display:grid;gap:8px;text-align:left}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.wrank{font-family:var(--f-num);color:var(--muted);font-size:18px;width:1.3em;text-align:center}
.wrow:nth-child(-n+3) .wrank{color:var(--coral)}
.wmid{display:grid;gap:5px;min-width:0}
.weq{font-family:var(--f-num);font-size:22px;line-height:1}
.weq span{color:var(--muted)}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--coral));border-radius:3px}
.wmeta{font-size:12px;color:var(--muted);font-weight:700}
.wx{border:1px solid var(--line);background:transparent;border-radius:10px;padding:12px 12px;min-height:44px;font-weight:700;cursor:pointer;font-size:13px;color:var(--muted)}
.wempty{color:var(--muted);padding:18px 8px;text-align:center;line-height:1.6}
.rules{margin:0;padding-left:1.2em;text-align:left;color:var(--muted);font-size:14px;line-height:1.6;display:grid;gap:5px}
.rules b{color:var(--paper)}
.banner.mega{font-size:clamp(40px,11vw,74px);color:var(--sun);-webkit-text-stroke:1.5px #7a5200;text-shadow:0 6px 0 #7a5200,0 0 30px rgba(255,210,63,.6)}
.banner.t3,.banner.t4{animation-duration:2.6s;font-size:clamp(46px,13vw,88px)}
.banner.t4{color:#fff;-webkit-text-stroke:2px var(--coral);text-shadow:0 6px 0 var(--coral),0 0 40px rgba(255,97,97,.8)}
.count{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none}
.count span{font-family:var(--f-num);font-size:clamp(90px,30vw,160px);color:var(--sun);text-shadow:0 8px 0 #a87a00;animation:cnt .7s ease forwards}
.count span.go{font-family:var(--f-zh);font-weight:900;font-size:clamp(56px,16vw,96px)}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}
.card h3,.btn,.link-btn,.danger,.opt button,.q-row span,.wmeta,.pet-intro,.gear-t,.gear button,.who-hint,.hint,.bm-why,.bm-task,.cmp-ask,.res-note,.lane-label,.m-d,.alum-t{text-wrap:balance}
.rules li,.info,.setrow small,.card p{text-wrap:pretty}
.rules li{overflow-wrap:anywhere}
:lang(ja) .m-t{font-size:18px} :lang(ja) .m-t em{font-size:13px}   /* 日文模式名比較長（流星ディフェンス），小一號才放得下名字加最高分 */
:lang(ja) body{line-height:1.35}   /* Zen Maru Gothic 預設行高 1.45、Chiron 1.35：統一成 1.35，日文版面的高度才跟中文一樣 */
.half.done .who{visibility:hidden}   /* 結束時大字不要壓在「小隊長」上 */
.m-t{flex-wrap:wrap;column-gap:8px} .m-t em{margin-left:auto}   /* 很窄的螢幕（320px）名字加最高分放不下時，最高分換到下一行，卡片不會被撐出螢幕 */
.brand-mark{white-space:nowrap} .pick b{white-space:nowrap}
.card>*{flex-shrink:0}   /* 卡片比螢幕高時要捲動，不能把結果卡的說明擠扁、疊到下面的數字 */
@media (max-width:380px){.tgrid{gap:4px}.tgrid button{aspect-ratio:auto;height:44px}}   /* 窄螢幕 6 格放不下 44px 正方形：寬度讓它縮，高度維持 44 */
@media (max-height:700px){.half.bot .who,#s-versus:not(.cpu) .half.top .who{display:none}}   /* 矮螢幕拔河：「小隊長」名牌會壓到中間的繩子 */
@media (max-height:600px){.bm-task small{display:none}}   /* 很矮的螢幕炸彈的說明小字省掉，「下一顆」才不會掉出畫面 */
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-iteration-count:1!important}.count span{animation:none;opacity:1}.banner.on{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">

  <section class="screen" id="s-menu">
    <button class="menu-pet" id="menu-pet" type="button" data-ta="menu.pet" tabindex="-1" hidden><span id="menu-pet-img"></span></button>
    <div class="menu-in">
      <button class="who" type="button" id="go-who" data-ta="who.switch"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg><span id="who-name"></span></button>
      <header class="brand">
        <div class="brand-mark" data-t="brand.mark"></div>
        <div class="brand-sub"><span data-t="brand.sub"></span><small id="brand-note"></small></div>
      </header>
      <nav class="modes" data-ta="menu.modes">
        <button class="mode" id="go-meteor" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 6 30 28" stroke="#ffae57" stroke-width="7" stroke-linecap="round" opacity=".35"/><path d="M14 4 34 22" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" opacity=".55"/><circle cx="40" cy="38" r="16" fill="#7c6c80" stroke="#ffae57" stroke-width="2.5"/><circle cx="34" cy="33" r="4" fill="#4a3d4f"/><circle cx="46" cy="44" r="3" fill="#4a3d4f"/><circle cx="45" cy="31" r="2" fill="#4a3d4f"/></svg>
          <span class="m-t"><span data-t="meteor.name"></span><em id="b-meteor"></em></span>
          <span class="m-d" data-t="meteor.desc"></span>
        </button>
        <button class="mode" id="go-ghost" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true"><g opacity=".55" stroke="#5ff2d0" stroke-width="2" fill="none" stroke-dasharray="4 3"><path d="M8 22h22l8 6-8 6H8z"/></g><path d="M14 40h24l9 7-9 7H14z" fill="#ffd23f"/><circle cx="34" cy="47" r="3" fill="#08111f"/><path d="M14 42 6 47l8 5z" fill="#ff6161"/><path d="M50 10v44" stroke="#f2f6fb" stroke-width="2"/><path d="M50 10h10v8H50z" fill="#f2f6fb"/></svg>
          <span class="m-t"><span data-t="ghost.name"></span><em id="b-ghost"></em></span>
          <span class="m-d" data-t="ghost.desc"></span>
          <span class="m-lock" hidden></span>
        </button>
        <button class="mode" id="go-versus" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 32h48" stroke="#d1a86e" stroke-width="6" stroke-linecap="round"/><circle cx="8" cy="32" r="7" fill="#5ff2d0"/><circle cx="56" cy="32" r="7" fill="#ffae57"/><path d="m32 22 3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7-5.2-4.8 7-.8z" fill="#ffd23f"/></svg>
          <span class="m-t" data-t="versus.name"></span>
          <span class="m-d" data-t="versus.desc"></span>
          <span class="m-lock" hidden></span>
        </button>
        <button class="mode" id="go-cmp" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="34" width="12" height="24" rx="4" fill="#5ff2d0"/><rect x="26" y="18" width="12" height="40" rx="4" fill="#ffd23f"/><rect x="44" y="28" width="12" height="30" rx="4" fill="#ffae57"/><path d="m32 2 2.3 5 5.5.6-4.1 3.7 1.2 5.4L32 14l-4.9 2.7 1.2-5.4-4.1-3.7 5.5-.6z" fill="#ffd23f" stroke="#a87a00" stroke-width="1.5"/></svg>
          <span class="m-t"><span data-t="cmp.name"></span><em id="b-cmp"></em></span>
          <span class="m-d" data-t="cmp.desc"></span>
          <span class="m-lock" hidden></span>
        </button>
        <button class="mode" id="go-bomb" type="button">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="28" cy="38" r="20" fill="#2a3f58" stroke="#93a9c0" stroke-width="2"/><path d="M38 20l6-8" stroke="#93a9c0" stroke-width="4" stroke-linecap="round"/><path d="M44 12c4-6 10-4 12 0" stroke="#ffae57" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="56" cy="12" r="5" fill="#ffd23f"/><circle cx="56" cy="12" r="2" fill="#fff"/><text x="28" y="46" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="22" fill="#5ff2d0">7</text></svg>
          <span class="m-t"><span data-t="bomb.name"></span><em id="b-bomb"></em></span>
          <span class="m-d" data-t="bomb.desc"></span>
          <span class="m-lock" hidden></span>
        </button>
      </nav>
      <div class="menu-foot">
        <button class="chip" id="go-map" type="button"><span data-t="menu.map"></span> <b id="b-stars"></b></button>
        <button class="chip" id="go-wrong" type="button"><span data-t="menu.wrong"></span> <b id="b-wrong">0</b></button>
        <button class="chip" id="go-pet" type="button"><span data-t="menu.pet"></span> <b id="b-pet">0</b></button>
        <button class="chip" id="go-quest" type="button"><span data-t="menu.quest"></span> <b id="b-quest">0/3</b></button>
        <button class="chip" id="go-help" type="button" data-t="menu.help"></button>
        <button class="chip" id="go-set" type="button" data-t="menu.set"></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-meteor" hidden>
    <div class="hud">
      <div class="hud-l">
        <div class="hearts" id="m-hearts" data-ta="m.hearts"></div>
        <svg class="hshield" id="m-hshield" viewBox="0 0 24 24" data-ta="m.inv" hidden><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="rgba(255,210,63,.3)" stroke="#ffd23f" stroke-width="2"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <button class="fire" id="m-fire" type="button" data-ta="m.fireAria" hidden></button>
      </div>
      <div class="score"><span id="m-score">0</span><small id="m-wave"></small></div>
      <div class="hud-r">
        <div class="combo" id="m-combo"></div>
        <button class="icon-btn" id="m-pause" type="button" data-ta="pause"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="freeze" id="m-freeze" hidden><i></i></div>
    <div class="freeze gold" id="m-dbl" hidden><i></i></div>
    <div class="freeze inv" id="m-inv" hidden><i></i></div>
    <div class="stage">
      <div class="banner" id="banner"></div>
      <button class="fire-big" id="m-fire2" type="button" hidden data-ta="m.fireAria"></button>
    </div>
    <div class="dock" id="m-dock">
      <div class="answer" id="m-answer"></div>
      <div class="pad" id="m-pad"></div>
    </div>
  </section>

  <section class="screen" id="s-ghost" hidden>
    <div class="topbar">
      <button class="link-btn" type="button" data-home data-t="back"></button>
      <div class="timer"><span id="g-timer">0.0</span><small data-t="secUnit"></small></div>
    </div>
    <div class="track">
      <div class="lane-row"><span class="lane-label" data-t="g.you"></span><div class="lane"><div class="racer" id="g-you"><svg viewBox="0 0 42 28" aria-hidden="true"><path d="M8 4h22l10 10-10 10H8z" fill="#ffd23f"/><circle cx="27" cy="14" r="3.5" fill="#08111f"/><path d="M8 7 1 14l7 7z" fill="#ff6161"/></svg></div></div></div>
      <div class="lane-row"><span class="lane-label" id="g-glabel" data-t="g.newbie"></span><div class="lane"><div class="racer g" id="g-ghost"><svg viewBox="0 0 42 28" aria-hidden="true"><path d="M8 4h22l10 10-10 10H8z" fill="none" stroke="#5ff2d0" stroke-width="2.4" stroke-dasharray="4 3"/><path d="M8 7 1 14l7 7z" fill="#5ff2d0" opacity=".6"/></svg></div></div></div>
      <div class="ghost-note" id="g-note"></div>
    </div>
    <div class="qwrap">
      <div class="qcard" id="g-card">
        <div class="prog" id="g-prog"></div>
        <div class="aq" id="g-q"></div>
        <div class="hint" id="g-hint"></div>
      </div>
    </div>
    <div class="dock"><div class="pad" id="g-pad"></div></div>
  </section>

  <section class="screen" id="s-versus" hidden>
    <div class="half top" id="v-top">
      <div class="who" id="v-topwho" data-t="v.challenger"></div>
      <div class="cpubox" id="v-cpu" hidden>
        <svg class="cpu-face" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="14" width="44" height="38" rx="12" fill="#2a3f58" stroke="#93a9c0" stroke-width="2"/><path d="M32 14V6" stroke="#93a9c0" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="5" r="3" fill="#ff6161"/><circle cx="23" cy="31" r="5" fill="#5ff2d0"/><circle cx="41" cy="31" r="5" fill="#5ff2d0"/><path id="v-mouth" d="M23 43q9 6 18 0" fill="none" stroke="#5ff2d0" stroke-width="3" stroke-linecap="round"/></svg>
        <div class="think"><i id="v-think"></i></div>
        <div class="cpu-say" id="v-say" data-t="v.thinking"></div>
      </div>
      <div class="aq" data-q></div>
      <div class="hint" data-hint></div>
      <div class="pad" data-pad></div>
      <div class="vres" id="v-res-top" data-res hidden></div>
    </div>
    <div class="band" id="v-band">
      <span class="end p1" aria-hidden="true"></span>
      <div class="rope" id="v-rope"><span class="mid"></span>
        <svg class="knot" id="v-knot" viewBox="0 0 34 34" aria-hidden="true"><path d="m17 2 4.4 9.4 10.2 1.2-7.6 7 2 10.1L17 24.6l-9 5.1 2-10.1-7.6-7 10.2-1.2z" fill="#ffd23f" stroke="#a87a00" stroke-width="2"/></svg>
      </div>
      <span class="end p2" aria-hidden="true"></span>
      <button class="icon-btn" id="v-quit" type="button" data-ta="v.pauseAria"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
      <div class="band-btns" id="v-btns" hidden>
        <button class="btn" type="button" id="v-again" data-t="v.again"></button>
        <button class="btn alt" type="button" data-home data-t="homeShort"></button>
      </div>
    </div>
    <div class="half bot" id="v-bot">
      <div class="who" data-t="v.captain"></div>
      <div class="aq" data-q></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const safeTop = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;   // 瀏海安全區（env() 只能從 CSS 讀）
const T_MAX = 12, STD_TABLES = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// 畫布字型：日文介面換成 Zen Maru Gothic（setLang() 會呼叫 canvasFonts()）
let NUMF = '', ZHF = '';
function canvasFonts() {
  const ja = LANG === 'ja';
  NUMF = ja ? "'Lilita One','Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif" : "'Lilita One','Chiron GoRound TC','PingFang TC','Microsoft JhengHei',sans-serif";
  ZHF = ja ? "'Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif" : "'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
}
const now = () => performance.now();

/* ================= 介面文字 ================= */
// 所有介面文字都在 STR[語言][key]，用 tx(key, { 參數 }) 取：字串裡的 {n} 換成參數；值也可以是函式（英文複數之類）或陣列（建議名字）。
// HTML 用 data-t（textContent）、data-th（innerHTML，含 <b>）、data-ta（aria-label）、data-tp（placeholder）標 key，applyStr() 填進去。
// 新增文字：先加到 'zh-Hant'，再補 en、ja（缺的 key 會退回中文）。改了文字要重跑 tools/make-fonts.py。
// 語言存在 DB.set.lang（每個人各自的設定，跟音樂一樣）；空字串＝跟著裝置語言（langAuto()）。

    'help.games': '五個遊戲', 'help.other': '其他', 'help.chestT': '寶箱流星', 'help.comboT': '連擊', 'help.whoT': '誰在玩', 'help.questT': '每日任務',
    'help.meteor': '<li>流星上有算式，打出答案，砲台就會發射雷射打掉它。砲台會一直瞄準<b>同一顆</b>直到打掉；有別顆快掉到地上了，才會先轉過去打它，這時下面的題目會跳一下。</li><li>答錯了流星會亮出答案，<b>照著再打一次</b>就能打掉。</li><li>有時候流星上寫「7 的倍數」加一串數字「7、14、?、28」，<b>打出問號的數字</b>就好。幽靈競速和拔河也會遇到。</li><li>流星掉到小鎮會<b>扣 1 顆心</b>。一整波都沒失誤 +50 分。</li><li>每 5 波出現<b>錯題魔王</b>，專出你常錯或還不熟的題目。要<b>一次就答對</b>才算打中一下，打中 6 下以上才打得倒，波數越高血越多。魔王來的時候沒有小流星，專心打牠就好。打倒 +200 分、<b>必掉寶箱</b>。</li><li>魔王掉到小鎮也是<b>扣 1 顆心</b>，然後下一波就開始了。</li><li>補心只靠寶箱，心最多 3 顆。</li><li><b>一擊即死</b>：只有 1 顆心，最高分另計。</li>',
    'help.chest': '<li>第 2 波起，<b>? × 7 = 56</b> 這種反過來問的流星會帶著寶箱。<b>一次就答對</b>打掉它，就會掉一樣東西。</li><li>寶箱有三種：<b>銀色</b>常見、<b>金色</b>少見、<b>彩虹色</b>稀有，越稀有開起來越熱鬧。</li><li>銀色：+30 分、時間凍結、<b>連擊護盾</b>。金色：雙倍得分 10 秒、無敵 10 秒、<b>追蹤飛彈</b>。</li><li>連擊護盾：右上角的連擊數字會罩在一顆亮亮的泡泡裡。答錯或流星掉到小鎮時幫你擋一次，<b>連擊不會歸零</b>，泡泡就破了。已經有泡泡了，再拿到就變成 +50 分。</li><li>追蹤飛彈最多存 3 枚（滿了再拿到就變成 +50 分），左上角會顯示你有幾枚。魔王出現時，鍵盤上面會跳出一顆閃閃的<b>「發射」鈕</b>，按一下射一枚，每枚扣魔王 1 滴血，但最後 1 滴要自己打。</li><li>彩虹色：<b>超新星</b>把正在掉的小流星全部清掉（你正在打的那顆和魔王除外）、<b>無敵 20 秒</b>、<b>補一顆心</b>（心已經 3 顆、或一擊即死模式，就變成 +100 分）。</li>',
    'help.combo': '<li>每題 10 分，2.5 秒內答對再 +5。每連對 5 題，分數多乘 1 倍，最多 5 倍。答錯後照著重打只有 3 分，也不算連擊。</li><li>連擊 10、30、50、100 有慶祝動畫。答錯或流星落地，連擊歸零。</li>',
    'help.ghost': '<li>20 題計時。另一條跑道是<b>最快的你</b>（你最好的一次），追過它就是新紀錄。第一次是跟<b>新手幽靈</b>跑。</li><li>輸了幽靈會慢一點點（最多三次），追過它就會慢慢變回最快的你。</li>',
    'help.versus': '<li>平板放中間，面對面搶答。答對把星星拉過來一格，先拉到底的贏；答錯停 1 秒。</li><li>拉很久還分不出勝負，<b>繩子會變滑</b>：45 秒後一次拉兩格，一分半後一次拉三格。</li><li>下方「小隊長」的作答會記進星圖和錯題本。</li><li>沒有人陪你玩？選<b>機器人</b>當對手。它算題的速度跟你平常差不多，你落後它會慢一點，你領先它會快一點，偶爾也會算錯。</li>',
    'help.cmp': '<li>一次有三個算式。題目問<b>最大</b>，就點答案最大的；問<b>最小</b>，就點答案最小的。點對不會點亮星星（要打出答案才算）。</li><li>三個答案都很接近，要先算出來再點。連對 3 題，答案會變得更接近。</li><li>點錯了，三個答案會亮出來，<b>點對的那個</b>就能繼續。點錯時，正確的那題和你點的那題，以後都會更常出現，你點的那題下次玩流星或幽靈時也會再考你一次。</li><li>一局 10 題。<b>10 題全對</b>才比誰最快；錯一題，這局就不比時間。</li>',
    'help.bomb': '<li>炸彈上寫「<b>7 的倍數</b>」，就是 7 的乘法表的答案：7、14、21……。格子裡不一定每個都有，有幾個就點幾個，下面會寫「找到 0 / 5」。點對不會點亮星星（要打出答案才算）。</li><li>點到不是的數字會<b>爆炸</b>，引線燒完也會爆炸。小心 27、57 這種長得很像的數字！點錯的、沒找到的，以後會多出現一點，下次玩流星或幽靈時也會再考你一次。</li><li>一局 5 顆炸彈。<b>5 顆全拆</b>才比誰最快。</li>',
    'help.map': '<li>每一題<b>打對</b> 3 次以上（×1 的題 1 次就好）、又快又穩，就會<b>點亮成一顆星</b>。點任一格可以看這題的紀錄。</li><li>紅色一閃一閃的是<b>容易錯</b>的題目，遊戲裡會偷偷更常出現，直到你把它練熟。</li>',
    'help.wrong': '<li>答錯過的題目都列在這裡，最常錯的排最前面。</li><li>練熟了它會自己消失；也可以按「清除」把那題的紀錄歸零。</li>',
    'help.pet': '<li>答對題目會掉<b>星塵</b>（主選單「寵物」旁邊的數字）。打倒魔王、完成任務會多給。</li><li>到寵物頁按「餵星塵」，餵夠了牠就長大：<b>蛋 → 幼體 → 少年 → 成體 → 究極</b>。</li><li>每日任務的<b>徽章</b>集到幾個，寵物就能戴新配件（徽章不會用掉），一共十樣：蝴蝶結、圍巾、墨鏡、氣球、棒球帽、圓框眼鏡、領結、星星髮夾、魔法師帽、彩虹光環。還有兩樣<b>神祕配件</b>，徽章夠多才會出現。</li><li>頭頂、臉、脖子、旁邊、背後五個位置可以<b>同時各戴一樣</b>，在寵物頁點一下就戴上，再點一下脫掉。</li><li>養到究極，可以<b>放牠回家</b>（山上、海裡或叢林），然後再養一顆新蛋。回家的夥伴會記在寵物頁。</li><li>點寵物頁下面回家的夥伴，可以去看牠，也可以<b>請牠回來</b>。現在的寵物會先回家休息，長大的進度都會留著，隨時可以再換回來。</li><li>還有一顆<b>傳說蛋</b>：徽章集滿 30 個、而且送過一隻回家，才能選牠。</li><li>不餵也不會怎樣，牠會乖乖等你。</li>',

    author: '指數三寶飯', 'legal.id': ' (ianyclin) ', 'legal.rights': 'All rights reserved.',
    'about.title': 'About <span class="brand-t">9×9 Meteor Squad</span>', 'about.what': 'What is this?', 'about.parents': 'For parents', 'about.made': 'Credits',
    'about.whatL': '<li>A times tables game for kids (around 2nd–3rd grade). The goal isn\'t learning the facts for the first time. It takes "I know them but slip sometimes" all the way to <b>fast and never wrong</b>.</li><li>Missed facts quietly come up more often, while your child just feels like they\'re playing. The Star Map shows how well each fact is known.</li>',
    'about.parentsL': '<li><b>No ads, no tracking, no data collected.</b> All records stay on this device.</li><li>Each player\'s records are kept separately ("Who\'s playing" on the menu). To move to a new device, use Settings → For grown-ups → Back up records. Deleting the app or clearing its data erases them. To start over, use "Erase all records" on the Star Map page (a grown-up solves a problem first).</li>',
    'about.author': 'Made by <a href="#" class="about-fb">指數三寶飯</a> (a dad of three).',
    privacy: 'Privacy Policy', 'about.priv': '<a href="#" class="about-priv">Privacy Policy</a>: we collect no data at all (a grown-up solves a problem first to open it).',
    'about.credits': 'Pet and outfit art is AI-generated. Fonts are Chiron GoRound TC, Zen Maru Gothic and Lilita One (SIL Open Font License), bundled with the game, so nothing loads from outside. Music and sound effects are synthesized live in code.',
    'about.ver': 'Version 1.3. © 2026 指數三寶飯. All rights reserved.', 'about.env': '  Screen {w}×{h}, canvas {cw}×{ch} @{d}',
    'gate.title': 'Grown-up check', 'gate.why': 'To open an outside web page, a grown-up needs to answer this first.', 'gate.go': 'Open', 'gate.ok': 'Correct!', 'gate.no': 'Not quite. Try again',
    rotate: 'Please turn your phone upright',
    'help.games': 'Five games', 'help.other': 'More', 'help.chestT': 'Treasure meteors', 'help.comboT': 'Combos', 'help.whoT': 'Who\'s playing', 'help.questT': 'Daily missions',
    'help.meteor': '<li>Each meteor has a math problem. Type the answer and the cannon zaps it with a laser. The cannon keeps aiming at <b>the same meteor</b> until it\'s gone. It only turns to another one that\'s about to hit the ground, and then the problem below gives a little hop.</li><li>If you answer wrong, the meteor shows the answer. <b>Type it in</b> to knock it down.</li><li>Sometimes a meteor says "Count by 7s" with numbers like "7, 14, ?, 28". Just <b>type the missing number</b>. You\'ll see these in Ghost Race and Tug of War too.</li><li>A meteor that hits the town <b>costs 1 heart</b>. A whole wave with no misses: +50 points.</li><li>Every 5 waves the <b>Mistake Boss</b> shows up with problems you often miss or don\'t know well yet. Only answers <b>right on the first try</b> count as hits. It takes 6 or more hits, and more in later waves. No small meteors come with the boss, so just focus on it. Beat it for +200 points and a <b>chest every time</b>.</li><li>If the boss hits the town, that\'s also <b>1 heart</b>, and the next wave starts.</li><li>Hearts only come from chests. You can have up to 3.</li><li><b>One Hit</b>: only 1 heart, with its own high score.</li>',
    'help.chest': '<li>From wave 2, meteors that ask backwards, like <b>? × 7 = 56</b>, carry a chest. Knock one down <b>right on the first try</b> and it drops something.</li><li>There are three kinds of chests: <b>silver</b> (common), <b>gold</b> (not so common) and <b>rainbow</b> (rare). Rarer chests open with a bigger party.</li><li>Silver: +30 points, time freeze, <b>combo shield</b>. Gold: double points for 10 seconds, invincible for 10 seconds, <b>homing missile</b>.</li><li>Combo shield: your combo number (top right) sits in a shiny bubble. If you answer wrong or a meteor hits the town, it protects you once: <b>your combo stays</b> and the bubble pops. Getting another while you have one gives +50 points.</li><li>You can store up to 3 homing missiles (more give +50 points). The top left shows how many you have. When the boss appears, a flashing <b>"Fire" button</b> pops up above the keypad. Each tap fires one missile and takes 1 hit off the boss, but the last hit is up to you.</li><li>Rainbow: <b>Supernova</b> clears all the small falling meteors (except the one you\'re answering and the boss), <b>invincible for 20 seconds</b>, or <b>an extra heart</b> (+100 points if you already have 3 or are playing One Hit).</li>',
    'help.combo': '<li>Each answer is 10 points, +5 if you answer within 2.5 seconds. Every 5 in a row adds 1 to your multiplier, up to ×5. Retyping after a mistake gives only 3 points and doesn\'t count for your combo.</li><li>Combos of 10, 30, 50 and 100 get a celebration. A mistake or a meteor hitting the ground resets your combo.</li>',
    'help.ghost': '<li>20 questions against the clock. The other lane is <b>the fastest you</b> (your best run). Pass it to set a new record. The first time, you race the <b>rookie ghost</b>.</li><li>If you lose, the ghost slows down a little (up to three times). Beat it, and it slowly speeds back up to your best.</li>',
    'help.versus': '<li>Put the tablet between you and answer face to face. Each right answer pulls the star one step toward you. Pull it all the way to win. A wrong answer freezes you for 1 second.</li><li>If nobody wins for a long time, <b>the rope gets slippery</b>: after 45 seconds each pull moves 2 steps, after 90 seconds 3 steps.</li><li>Only the bottom player (the Captain) gets answers saved to the Star Map and Mistakes.</li><li>Nobody to play with? Pick the <b>Robot</b>. It answers about as fast as you usually do. It slows down when you\'re behind, speeds up when you\'re ahead, and makes mistakes sometimes too.</li>',
    'help.cmp': '<li>You get three problems. If it asks for the <b>biggest</b>, tap the one with the biggest answer. If it asks for the <b>smallest</b>, tap the smallest. Tapping doesn\'t light up stars (only typed answers do).</li><li>The answers are close, so work them out before you tap. After 3 right in a row, they get even closer.</li><li>If you tap the wrong one, all three answers show. Tap <b>the right one</b> to go on. Both the right problem and the one you tapped will come up more often, and the one you tapped comes back next time you play Meteor Defense or Ghost Race.</li><li>A round is 10 questions. Only <b>all 10 right</b> counts for a best time. One mistake and that round isn\'t timed.</li>',
    'help.bomb': '<li>If the bomb says <b>7</b>, tap the answers in the 7 times table: 7, 14, 21… Not all of them are on the board, so tap the ones you find. Below, it says "Found 0 / 5". Tapping doesn\'t light up stars (only typed answers do).</li><li>Tap a number that doesn\'t belong and the bomb <b>explodes</b>. It also explodes when the fuse burns out. Watch out for look-alikes like 27 and 57! Numbers you tapped wrong or didn\'t find come up a bit more, and come back next time you play Meteor Defense or Ghost Race.</li><li>A round is 5 bombs. Only <b>all 5 defused</b> counts for a best time.</li>',
    'help.map': '<li>Type a problem right 3 or more times (×1 problems just once), fast and steady, and it <b>lights up as a star</b>. Tap any square to see its record.</li><li>Flashing red squares are <b>tricky</b> problems. They secretly come up more often in the games until you\'ve got them.</li>',
    'help.wrong': '<li>Problems you got wrong are listed here, most missed first.</li><li>Once you know one, it disappears by itself. You can also tap "Clear" to reset it.</li>',
    'help.pet': '<li>Right answers drop <b>stardust</b> (the number next to "Pet" on the menu). Beating bosses and finishing missions give extra.</li><li>On the pet page, tap "Feed stardust". Feed enough and it grows: <b>Egg → Baby → Kid → Grown-up → Ultimate</b>.</li><li>Collect <b>badges</b> from daily missions to unlock outfits (badges never get used up). There are ten: bow, scarf, sunglasses, balloon, cap, round glasses, bow tie, star clip, wizard hat and rainbow halo. Two <b>mystery items</b> appear when you have lots of badges.</li><li>Head, face, neck, side and back: you can <b>wear one thing in each spot</b> at the same time. Tap to put it on, tap again to take it off.</li><li>When your pet is Ultimate, you can <b>let it go home</b> (to the mountains, the sea or the jungle) and raise a new egg. Pets that went home are listed on the pet page.</li><li>Tap a pet that went home to visit it, or <b>bring it back</b>. Your current pet goes home to rest and keeps its progress, so you can swap back anytime.</li><li>There\'s also a <b>legendary egg</b>: collect 30 badges and send one pet home to unlock it.</li><li>Nothing bad happens if you don\'t feed it. It will wait for you.</li>',
    'help.quest': '<li>There are <b>3 small missions</b> every day. They check off by themselves. Finish all three for a <b>badge</b>.</li><li>Finish several days in a row and you\'ll see your streak. New missions come tomorrow.</li>',
    'help.who': '<li>Tap the little person at the top of the menu to <b>switch players</b>. Everyone gets their own star map, records and pet. Up to 4 players.</li><li>Getting a new tablet or phone? A grown-up can move your records with <b>Back up records</b> in Settings.</li>',

    'help.tables': '<li>In Settings, tap the numbers. <b>Only lit tables are asked.</b> Normally 1 to 9 are lit: the classic times tables.</li><li>While you\'re still learning, keep just the ones you know, like only 2 and 5.</li><li>For a challenge, light up 10, 11 and 12 too. Answers go up to 144.</li><li>All the games and the Star Map follow along. Each set of tables keeps <b>its own best times</b>.</li>',

const LANGS = ['zh-Hant', 'en', 'ja'];
// 裝置語言：zh 開頭（含簡中裝置）→ 繁中，ja → 日文，其他一律英文
const langAuto = () => { for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''])) { const x = String(l).toLowerCase(); if (x.startsWith('zh')) return 'zh-Hant'; if (x.startsWith('ja')) return 'ja'; if (x.startsWith('en')) return 'en'; } return 'en'; };
let LANG = 'zh-Hant';
const nameMax = () => LANG === 'en' ? 10 : 6;   // 英文名字比較長；存檔一律最多 10 個字
function tx(key, v) {
  let s = STR[LANG][key];
  if (s === undefined) s = STR['zh-Hant'][key];
  if (s === undefined) return key;   // 缺字串直接露出 key，一眼看得出來
  if (typeof s === 'function') return s(v || {});
  return (v && typeof s === 'string') ? s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)) : s;
}
function applyStr() {
  document.documentElement.lang = tx('htmlLang'); document.title = tx('title');
  $$('[data-t]').forEach(e => { e.textContent = tx(e.dataset.t); });
  $$('[data-th]').forEach(e => { e.innerHTML = tx(e.dataset.th); });
  $$('[data-ta]').forEach(e => e.setAttribute('aria-label', tx(e.dataset.ta)));
  $$('[data-tp]').forEach(e => e.setAttribute('placeholder', tx(e.dataset.tp)));
  $$('.name-in').forEach(e => { e.maxLength = nameMax(); });
  const m = { m: tx('meteor.name') };
  $('#help-unlock').innerHTML = tx('help.unlock', m); $('#about-buy').innerHTML = tx('about.buyL', m);
  renderLocks(); renderSetUnlock();
}
// 依目前的人的設定（沒設就看裝置）換語言；載入、換人、在設定頁切換時呼叫
function setLang() { LANG = LANGS.includes(DB.set.lang) ? DB.set.lang : langAuto(); canvasFonts(); applyStr(); }

// 多人：WHO = { cur, list:[{id, name}] } 存在 PKEY；每個人一把存檔 key（第一個人 id 是空字串，沿用舊 key，舊存檔自動變成第一個人）
let KEY = 'jiujiu-meteor-v1';
let bkFrozen = false;   // 備份匯入寫完、重新載入之前，記憶體裡的舊紀錄不能再寫回去（save／saveWho 都看它）
const PKEY = 'jiujiu-meteor-who', WHO_MAX = 4;
let WHO = { cur: '', list: [{ id: '', name: '' }] };
try {
  const w = JSON.parse(localStorage.getItem(PKEY));
  if (w && Array.isArray(w.list) && w.list.length) WHO = { cur: typeof w.cur === 'string' ? w.cur : '', list: w.list.filter(x => x && typeof x.id === 'string').map(x => ({ id: x.id, name: String(x.name || '').slice(0, 10) })).slice(0, WHO_MAX), asked: !!w.asked };
} catch (e) {}
WHO.list = WHO.list.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);
if (!WHO.list.length) WHO.list = [{ id: '', name: '' }];
if (!WHO.list.some(x => x.id === WHO.cur)) WHO.cur = WHO.list[0].id;
const keyFor = id => id ? `jiujiu-meteor-v1:${id}` : 'jiujiu-meteor-v1';
const saveWho = () => { if (bkFrozen) return; try { localStorage.setItem(PKEY, JSON.stringify(WHO)); } catch (e) {} };
const whoCur = () => WHO.list.find(x => x.id === WHO.cur) || WHO.list[0];
KEY = keyFor(WHO.cur);

const BEST0 = () => ({ meteor: 0, sudden: 0, ghost: null, cmpT: null, bomb: null, ghostLoss: 0 });
let recent = [], retest = [], draws = 0, lastRetest = -9, retestPick = '';   // retest：答錯的題 6～12 題後一定再考一次（延遲重測比立刻照抄有效）；兩次重測至少隔 2 題；存檔存 key（DB.retest），關掉再開也會考
const fresh = () => mkDB({ facts: {}, bests: {}, retest: [], tm: TMODE, set: { mix: false, sound: true, music: true, sudden: false, seqLabel: true, tables: STD_TABLES.slice(), lang: '' },
  daily: { date: '', tasks: [], badges: 0, streak: 0, lastDone: '', starBase: 0, ans: 0, wrong: 0, log: {} },
  pet: { kind: '', name: '', dust: 0, fed: 0, wear: { head: '', face: '', neck: '', side: '', back: '' }, released: [], sent: 0 } });
// 最佳紀錄依乘法表範圍分開存（bests[rangeKey]），DB.best 永遠指向目前範圍那一份；getter 不可列舉所以不會存進 JSON
function mkDB(o) {
  Object.defineProperty(o, 'best', { enumerable: false, configurable: true, get() { const k = rangeKey(); return o.bests[k] || (o.bests[k] = BEST0()); } });

const FB_URL = 'https://www.facebook.com/profile.php?id=100084000897269';   // 指數三寶飯粉絲專頁（不帶追蹤參數）
let gate = null;
// target 是網址（答對後出現「前往」鈕，用 click 開才不會被 iOS 擋）或函式（答對直接執行，例如清除紀錄）
function openGate(target, why) {
  // 題目是混合運算（先乘除、後加減）：孩子在練的正是乘法，純乘法擋不住他們；「5 + 2 × 13」要記得先乘，沒學過運算順序的孩子會從左算到右而答錯
  const hard = typeof target === 'function';   // 清除紀錄、刪人這種不可逆的：兩個乘法一加一減，答案至少 10
  let expr, ans;
  do {
    if (hard) { const a = ri(10, 40), b = ri(12, 19), c = ri(3, 9), d = ri(3, 9), e = ri(3, 9); expr = `${a} + ${b} × ${c} − ${d} × ${e}`; ans = a + b * c - d * e; }
    else { const a = ri(3, 9), b = ri(3, 9), c = ri(12, 19); expr = `${a} + ${b} × ${c}`; ans = a + b * c; }
  } while (ans < 10);
  gate = { ans, expr, buf: '', target };
  $('#gate-why').textContent = why || tx('gate.why');
  $('#gate-q').innerHTML = `${expr} = ${slots(String(ans).length, '')}`; $('#gate-hint').textContent = ''; $('#gate-go').hidden = true; $('#gate-pad').hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // 不然按 Enter 會重開關卡
  $('#o-gate').hidden = false;
}
function gateKey(d) {

  if (d === 'back') gate.buf = gate.buf.slice(0, -1); else { gate.buf += d; SFX.key(); }
  const n = String(gate.ans).length;
  if (gate.buf.length >= n) {
    if (parseInt(gate.buf, 10) === gate.ans) {

      if (typeof t === 'function') { gate = null; $('#o-gate').hidden = true; t(); return; }
      gate.buf = ''; gate.ok = true; SFX.ding(); $('#gate-hint').textContent = tx('gate.ok'); $('#gate-pad').hidden = true; $('#gate-go').hidden = false; return;

  if (cv.clientWidth !== W || cv.clientHeight !== H || Math.min(2, window.devicePixelRatio || 1) !== DPR) resize();   // iOS 轉向時 resize 事件可能量到舊尺寸，畫布就被橫向壓扁；每幀核對，下一幀自己修正
  const cov = covered();
  if (cov && !document.hidden) shiftTimers(Math.max(0, raw) * 1000);   // 轉橫：畫面被「請轉直」蓋住，計時凍結（shiftTimers 吃毫秒）
  if (mode === 'meteor') { const r = $('#m-dock').getBoundingClientRect().top; if (Math.abs(r - GY) > 0.5) GY = r; }
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; const m = shakeM * Math.max(0, shakeT / 0.45); sx = rnd(-m, m); sy = rnd(-m, m); }
  g.save(); g.translate(sx, sy);
  drawWorld(GY, dt);
  const frozen = mode === 'meteor' && M && M.paused;
  if (mode === 'meteor' && M) { if (!M.paused && !M.over) updateMeteor(dt); drawMeteorScene(frozen ? 0 : dt); }
  if (!cov) {
    if (mode === 'ghost') updateGhost();
    if (mode === 'versus') updateVersus();
    if (mode === 'cmp') updateCmp();
    if (mode === 'bomb') updateBomb();
  }
  if (!frozen) stepP(dt);
  drawP();
  g.restore();
  if (RM) flashA = 0;   // 減少動態：不做全螢幕閃白
  if (flashA > 0) { g.fillStyle = `rgba(255,248,225,${flashA})`; g.fillRect(0, 0, W, H); flashA = Math.max(0, flashA - dt * 2.2); }
  requestAnimationFrame(frame);
}
resize(); refreshMenu();
requestAnimationFrame(frame);
})();
